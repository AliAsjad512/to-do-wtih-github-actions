name: Hello CodeFlow

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

jobs:
  greet:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://test-db:5432/codeflow_test
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: yarn install

      - name: test
        env:
          SQLITE_DB_LOCATION: /tmp/todos/todo.db
        run: yarn test

      - name: Show current date
        run: date

      - name: Log run date to file
        run: |
          mkdir -p logs
          echo "Workflow ran at: $(date -u)" >> logs/run-log.txt

      - name: Commit and push log file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/run-log.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Log run"
          git pull --rebase origin main
          git push

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase owner name
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/your-app-name:latest
            ghcr.io/${{ env.OWNER_LC }}/your-app-name:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/your-app-name:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/your-app-name:${{ github.sha }}
